<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- The tile: blue at the top left to green at the bottom right -->
    <linearGradient id="background" x1="180" y1="120" x2="860" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A6BFF"/>
      <stop offset="0.5" stop-color="#1FA8F0"/>
      <stop offset="1" stop-color="#2EE59D"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass: a light, see-through fill, brighter at the top -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.38"/>
    </linearGradient>
    <!-- Glass edges catch the light at the top and bottom -->
    <linearGradient id="glassRim" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="pupil" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#1B3C7A"/>
      <stop offset="1" stop-color="#0A1B3D"/>
    </radialGradient>

    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#06213F" flood-opacity="0.3"/>
    </filter>
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06304F" flood-opacity="0.32"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tileGlow)"/>

  <g clip-path="url(#tile)">
    <!-- Eyes, seen through the lenses -->
    <circle cx="352" cy="444" r="44" fill="url(#pupil)"/>
    <circle cx="672" cy="444" r="44" fill="url(#pupil)"/>
    <circle cx="336" cy="426" r="14" fill="#FFFFFF"/>
    <circle cx="656" cy="426" r="14" fill="#FFFFFF"/>

    <!-- Glasses: two glass lenses and a bridge -->
    <g filter="url(#glassShadow)">
      <rect x="214" y="338" width="262" height="204" rx="84" fill="url(#lensFill)" stroke="url(#glassRim)" stroke-width="30"/>
      <rect x="548" y="338" width="262" height="204" rx="84" fill="url(#lensFill)" stroke="url(#glassRim)" stroke-width="30"/>
      <path d="M478 412 Q512 378 546 412" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="26" stroke-linecap="round"/>
    </g>
    <!-- Highlights along the top of each lens -->
    <path d="M276 356 Q345 344 414 356" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9" filter="url(#soften)"/>
    <path d="M610 356 Q679 344 748 356" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9" filter="url(#soften)"/>

    <!-- Smile: a glass grin -->
    <g filter="url(#glassShadow)">
      <path d="M318 628 Q512 676 706 628 Q690 818 512 818 Q334 818 318 628 Z"
            fill="url(#glassFill)" stroke="url(#glassRim)" stroke-width="10" stroke-linejoin="round"/>
    </g>
    <path d="M360 652 Q512 690 664 652" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.85" filter="url(#soften)"/>
    <path d="M420 786 Q512 800 604 786" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.55" filter="url(#soften)"/>
  </g>
</svg>
