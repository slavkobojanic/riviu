<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE6FF"/>
    </linearGradient>
    <linearGradient id="body" x1="250" y1="260" x2="800" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.42" stop-color="#FF6A6A"/>
      <stop offset="0.78" stop-color="#C24CF0"/>
      <stop offset="1" stop-color="#7A5CFF"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAE4FF"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B3F8F"/>
      <stop offset="1" stop-color="#211A45"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2A1F5C" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3A1170" flood-opacity="0.35"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)" filter="url(#iconShadow)"/>

  <g clip-path="url(#squircle)">
    <!-- Owl: ear tufts, then body peeking up from the bottom -->
    <g filter="url(#softShadow)">
      <path d="M330 470 C298 390 276 330 262 282 C334 300 400 336 460 392 Z" fill="url(#body)" stroke="url(#body)" stroke-width="24" stroke-linejoin="round"/>
      <path d="M694 470 C726 390 748 330 762 282 C690 300 624 336 564 392 Z" fill="url(#body)" stroke="url(#body)" stroke-width="24" stroke-linejoin="round"/>
      <ellipse cx="512" cy="680" rx="300" ry="340" fill="url(#body)"/>
    </g>

    <!-- Gloss -->
    <ellipse cx="400" cy="430" rx="150" ry="70" fill="#FFFFFF" opacity="0.45" transform="rotate(-28 400 430)" filter="url(#blur)"/>

    <!-- Belly with diff lines -->
    <ellipse cx="512" cy="850" rx="170" ry="120" fill="#FFFFFF" opacity="0.28"/>
    <rect x="432" y="770" width="150" height="26" rx="13" fill="#2FD06A"/>
    <rect x="432" y="814" width="104" height="26" rx="13" fill="#FF4D5E"/>
    <rect x="432" y="858" width="168" height="26" rx="13" fill="#2FD06A"/>

    <!-- Eyes -->
    <circle cx="404" cy="568" r="100" fill="url(#eye)"/>
    <circle cx="620" cy="568" r="100" fill="url(#eye)"/>
    <circle cx="418" cy="582" r="48" fill="#23194D"/>
    <circle cx="636" cy="586" r="62" fill="#23194D"/>
    <circle cx="400" cy="562" r="16" fill="#FFFFFF"/>
    <circle cx="612" cy="560" r="20" fill="#FFFFFF"/>

    <!-- Magnifying glass over the right eye -->
    <line x1="712" y1="660" x2="812" y2="760" stroke="url(#rim)" stroke-width="46" stroke-linecap="round"/>
    <circle cx="620" cy="568" r="124" fill="#FFFFFF" fill-opacity="0.12" stroke="url(#rim)" stroke-width="30"/>
    <path d="M540 500 A110 110 0 0 1 610 456" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

    <!-- Beak -->
    <path d="M512 640 C530 650 548 664 552 676 C540 712 524 728 512 734 C500 728 484 712 472 676 C476 664 494 650 512 640 Z" fill="url(#beak)"/>
  </g>
</svg>
